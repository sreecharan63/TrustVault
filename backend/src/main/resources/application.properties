
# Application
spring.application.name=trustvault

# PostgreSQL Database Connection
spring.datasource.url=${TRUSTVAULT_DB_URL:jdbc:postgresql://localhost:5432/trustvault}
spring.datasource.username=${TRUSTVAULT_DB_USERNAME:postgres}
spring.datasource.password=${TRUSTVAULT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Secure document storage
trustvault.storage.location=${TRUSTVAULT_STORAGE_LOCATION:D:/TrustVault/storage}

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB